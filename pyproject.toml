[project]
name = "gated-uat"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
    "pynacl>=1.5.0",
]
# gated is a required dependency but is not yet published to PyPI.
# Development layout: sibling checkout at ../gated added to PYTHONPATH via conftest.py.
# Pinned commit: 07d2161 (3.5: P1-3 remediation — measurement-derived identity + frozen execution)
# Production deploy-tier: install gated from the pinned artifact hash (§11, not built here).

[project.optional-dependencies]
dev = [
    "mypy>=1.9",
    "ruff>=0.4",
    "pytest>=7.0",
]

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
