[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gated-uat"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
    "pynacl>=1.5.0",
]
# gated is a required dependency but is not yet published to PyPI.
# Development layout: sibling checkout at ../gated added to PYTHONPATH via conftest.py.
# Pinned commit: 628e5a3 (3.5 S3 ckpt3: trust + guard policy provenance)
# Production deploy-tier: install gated from the pinned artifact hash (§11, not built here).

[project.scripts]
gated-uat = "cli:main"

[project.optional-dependencies]
dev = [
    "mypy>=1.9",
    "ruff>=0.4",
    "pytest>=7.0",
]

[tool.mypy]
strict = true
ignore_missing_imports = true

# gated's modules are an external pinned dependency — suppress unused-ignore warnings
# that arise because nacl stubs are installed on this system but gated's code predates
# their availability.  gated-uat does not control gated's source.
[[tool.mypy.overrides]]
module = ["gate.*", "engine.*", "sandbox.*", "core.*"]
warn_unused_ignores = false

[tool.ruff]
line-length = 100
exclude = ["corpora/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
