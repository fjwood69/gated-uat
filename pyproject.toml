[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gated-uat"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
    "pynacl>=1.5.0",
]
# gated is a required dependency but is not yet published to PyPI.
# Development layout: sibling checkout at ../gated added to PYTHONPATH via conftest.py.
# Pinned commit: 1d75d54 (3.5 S3-completion: cross-store ABA closure + torn-read atomicity, SEALED)
# Production deploy-tier: install gated from the pinned artifact hash (§11, not built here).

[project.scripts]
gated-uat = "cli:main"

[project.optional-dependencies]
dev = [
    "mypy>=1.9",
    "ruff>=0.4",
    "pytest>=7.0",
]
# Board #2 live-reviewer swap: httpx backs make_anthropic_transport (lazy-imported, so the harness
# core + the fakes-only test suite need no network dep). Install this extra on the sealed-live run
# host; the one test that invokes the real transport importorskips it in a bare env.
live = [
    "httpx>=0.27",
]

[tool.mypy]
strict = true
ignore_missing_imports = true
# corpora/fixtures/*/main.py are executable test artifacts (all named main.py -> module-name
# collision); they are not package code. Excluded to match [tool.ruff], so `mypy --strict .` is clean.
exclude = ["corpora/"]

# gated's modules are an external pinned dependency — suppress unused-ignore warnings
# that arise because nacl stubs are installed on this system but gated's code predates
# their availability.  gated-uat does not control gated's source.
[[tool.mypy.overrides]]
module = ["gate.*", "engine.*", "sandbox.*", "core.*"]
warn_unused_ignores = false

[tool.ruff]
line-length = 100
exclude = ["corpora/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
# The harness test-suite lives entirely under tests/. Scope collection there so the repo's
# pytest never picks up corpora/fixtures/*/test_*.py — those are DEMONSTRATION artifacts (a
# producer's own suite), run INSIDE the sandbox by the own_tests stage via an explicit
# `pytest /artifact` path, NOT by the repo runner. Without this, the v2 fixtures' identically
# named test_retry.py modules collide on collection (and import a fixture-local `main`).
testpaths = ["tests"]
